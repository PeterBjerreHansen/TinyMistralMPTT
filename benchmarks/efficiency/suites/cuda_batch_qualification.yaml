name: cuda_batch_qualification_k2_2048
defaults:
  device: cuda
  model_dir: checkpoints/TinyMistral-248M-v3
  parameter_dtype: float32
  autocast_dtype: bfloat16
  attention_backend: auto
  warmup_steps: 1
  measure_steps: 3
  sequence_length: 2048
  grad_accum_steps: 1
cases:
  - {variant: memory_add, passes: 2, batch_size: 1}
  - {variant: memory_add, passes: 2, batch_size: 2}
  - {variant: memory_add, passes: 2, batch_size: 4}
  - {variant: memory_add, passes: 2, batch_size: 8}
  - {variant: memory_tape32, passes: 2, batch_size: 1}
  - {variant: memory_tape32, passes: 2, batch_size: 2}
  - {variant: memory_tape32, passes: 2, batch_size: 4}
  - {variant: memory_tape32, passes: 2, batch_size: 8}
