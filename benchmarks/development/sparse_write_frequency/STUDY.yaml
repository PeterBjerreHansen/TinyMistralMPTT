name: sparse_write_frequency
status: planned
question: >
  At fixed W=32, how far can MemoryTape write frequency be reduced while
  preserving useful recurrent signal, before selecting a cadence for a window
  sweep and a later MemoryAdd hybrid comparison?
arms:
  - {id: phase_a_dense, config: phase_a_dense.yaml}
  - {id: phase_a_c1, config: phase_a_c1.yaml}
  - {id: phase_a_c4, config: phase_a_c4.yaml}
  - {id: phase_a_c8, config: phase_a_c8.yaml}
  - {id: phase_a_c16, config: phase_a_c16.yaml}
  - {id: phase_a_c32, config: phase_a_c32.yaml}
  - {id: phase_b_vanilla, config: phase_b_vanilla.yaml}
  - {id: phase_b_dense, config: phase_b_dense.yaml}
  - {id: phase_b_c1, config: phase_b_c1.yaml}
  - {id: phase_b_c4, config: phase_b_c4.yaml}
  - {id: phase_b_c8, config: phase_b_c8.yaml}
  - {id: phase_b_c16, config: phase_b_c16.yaml}
  - {id: phase_b_c32, config: phase_b_c32.yaml}
comparisons:
  - name: phase_a_cadence_wiring
    arms: [phase_a_dense, phase_a_c1, phase_a_c4, phase_a_c8, phase_a_c16, phase_a_c32]
    experimental_axes: [variant, memory_write_mode, memory_write_stride]
  - name: phase_b_cadence_screen
    arms: [phase_b_dense, phase_b_c1, phase_b_c4, phase_b_c8, phase_b_c16, phase_b_c32]
    experimental_axes: [variant, memory_write_mode, memory_write_stride]
    allowed_differences: [init_from]
  - name: phase_b_vanilla_context
    arms: [phase_b_vanilla, phase_b_dense, phase_b_c1, phase_b_c4, phase_b_c8, phase_b_c16, phase_b_c32]
    experimental_axes: [variant, memory_write_mode, memory_write_stride]
    allowed_differences: [eval_passes, init_from, pass_loss_weights, pass_schedule]
