name: k_selection
status: complete
question: >
  Does K=3 provide enough quality or recurrent-stability benefit over K=2 to
  justify the additional training compute on the 2048-token development substrate?
arms:
  - {id: memory_add_k2, config: memory_add_k2.yaml}
  - {id: memory_add_k3, config: memory_add_k3.yaml}
  - {id: memory_tape32_k2, config: memory_tape32_k2.yaml}
  - {id: memory_tape32_k3, config: memory_tape32_k3.yaml}
comparisons:
  - name: memory_add_k
    arms: [memory_add_k2, memory_add_k3]
    experimental_axes: [pass_schedule, pass_loss_weights]
  - name: memory_tape32_k
    arms: [memory_tape32_k2, memory_tape32_k3]
    experimental_axes: [pass_schedule, pass_loss_weights]
